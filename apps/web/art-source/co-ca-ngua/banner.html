<!doctype html>
<!--
  Banner thẻ game Cờ cá ngựa ở trang /games (public/games/co-ca-ngua/banner.jpg).
  Dựng bằng chính màu, chữ và chi tiết của game (đêm chiến trường, cờ đuôi nheo, bàn chữ thập, dáng chiến mã
  lấy đúng đường viền quân trong art.ts), không dùng ảnh tạo bằng AI.
  Xuất lại sau khi sửa:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1280,720 --virtual-time-budget=4000 --screenshot=banner.png banner.html
    sips -s format jpeg -s formatOptions 88 banner.png --out ../../public/games/co-ca-ngua/banner.jpg
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@700&display=block"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1280px; height: 720px; overflow: hidden; }
      body {
        position: relative;
        background:
          radial-gradient(70% 60% at 78% 70%, rgba(255, 106, 26, 0.28), transparent 70%),
          radial-gradient(90% 70% at 20% -10%, #24272d, #0e1013 70%);
        font-family: 'Barlow Semi Condensed', sans-serif;
        color: #ece8e1;
      }
      /* Đá lát mờ dưới nền. */
      body::before {
        content: ''; position: absolute; inset: 0; opacity: 0.18;
        background:
          linear-gradient(#000 3px, transparent 3px) 0 0 / 120px 120px,
          linear-gradient(90deg, #000 3px, transparent 3px) 0 0 / 120px 120px;
        transform: perspective(900px) rotateX(58deg) translateY(160px) scale(1.6);
        transform-origin: 50% 100%;
      }
      .title { position: absolute; left: 76px; top: 150px; width: 560px; }
      .flags { display: flex; gap: 10px; margin-bottom: 22px; }
      h1 { font: 400 150px/0.86 'Anton', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; }
      .slash { width: 150px; height: 12px; margin: 26px 0 22px; background: #ff6a1a; transform: skewX(-30deg); }
      .sub { font-size: 32px; color: #9aa2ab; letter-spacing: 0.02em; text-transform: uppercase; }
      .stage { position: absolute; right: -40px; top: 40px; width: 720px; height: 680px; perspective: 1100px; }
      .board {
        position: absolute; left: 110px; top: 120px; width: 480px; height: 480px;
        transform: rotateX(58deg) rotateZ(-38deg);
        display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px;
        padding: 12px; background: #2a2e34;
        box-shadow: 0 60px 80px -30px rgba(0, 0, 0, 0.9), 0 0 0 10px #1c2025;
      }
      .board i { display: block; }
      .horses { position: absolute; inset: 0; }
      .horse { position: absolute; width: 120px; filter: drop-shadow(0 22px 14px rgba(0, 0, 0, 0.7)); }
      .die {
        position: absolute; left: 330px; top: 360px; width: 64px; height: 64px; border-radius: 12px;
        background: #e6dfd2; transform: rotate(-14deg);
        box-shadow: inset 0 -7px 0 rgba(60, 40, 20, 0.3), 0 18px 20px -8px rgba(0, 0, 0, 0.8);
      }
      .die b { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #1a1a1a; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <symbol id="flag" viewBox="0 0 24 24">
          <rect x="3" y="2" width="2" height="21" fill="#9aa2ab" />
          <path d="M5 3h16l-4 5.5 4 5.5H5z" />
        </symbol>
        <!-- Dáng chiến mã: cùng đường viền với warhorseShape() trong src/games/co-ca-ngua/art.ts. -->
        <symbol id="horse" viewBox="-0.5 -1.12 1.16 1.36">
          <g transform="scale(1,-1)">
            <path
              d="M-0.32 0 L0.34 0 C0.36 0.18 0.24 0.3 0.18 0.4 C0.3 0.44 0.5 0.45 0.58 0.55 C0.64 0.63 0.62 0.71 0.53 0.75 C0.42 0.83 0.32 0.9 0.22 0.92 L0.21 1.05 L0.1 0.94 C0.02 0.93 -0.12 0.87 -0.2 0.76 L-0.3 0.72 L-0.25 0.64 L-0.37 0.58 L-0.31 0.5 L-0.42 0.42 L-0.35 0.34 C-0.42 0.2 -0.36 0.08 -0.32 0 Z"
            />
            <ellipse cx="0.01" cy="-0.06" rx="0.46" ry="0.09" fill="#30353c" />
            <circle cx="0.36" cy="0.71" r="0.035" fill="#ffd38a" />
          </g>
        </symbol>
      </defs>
    </svg>

    <div class="title">
      <div class="flags">
        <svg width="52" height="52" fill="#e5383b"><use href="#flag" /></svg>
        <svg width="52" height="52" fill="#2fbf71"><use href="#flag" /></svg>
        <svg width="52" height="52" fill="#f6b81a"><use href="#flag" /></svg>
        <svg width="52" height="52" fill="#3a86ff"><use href="#flag" /></svg>
      </div>
      <h1>Cờ cá<br />ngựa</h1>
      <div class="slash"></div>
      <p class="sub">Chiến mã Tây Sơn · 2–4 nhà · Online</p>
    </div>

    <div class="stage">
      <div class="board" id="board"></div>
      <div class="horses">
        <svg class="horse" style="left: 150px; top: 250px; width: 130px; height: 152px" fill="#e5383b"><use href="#horse" /></svg>
        <svg class="horse" style="left: 270px; top: 170px; width: 104px; height: 122px" fill="#2fbf71"><use href="#horse" /></svg>
        <svg class="horse" style="left: 440px; top: 230px; width: 118px; height: 138px; transform: scaleX(-1)" fill="#3a86ff"><use href="#horse" /></svg>
        <svg class="horse" style="left: 420px; top: 120px; width: 92px; height: 108px; transform: scaleX(-1)" fill="#f6b81a"><use href="#horse" /></svg>
      </div>
      <div class="die"><b style="left: 11px; top: 11px"></b><b style="right: 11px; top: 11px"></b><b style="left: 11px; top: 25px"></b><b style="right: 11px; top: 25px"></b><b style="left: 11px; bottom: 11px"></b><b style="right: 11px; bottom: 11px"></b></div>
    </div>

    <script>
      // Lưới 15×15 đúng bố cục bàn trong game (src/games/co-ca-ngua/board.ts): đường đi đá xám quanh
      // chữ thập (kể cả bốn ô góc tâm), ô xuất quân nhuộm màu nhà, sáu bậc về chuồng màu nhà, tâm sáng,
      // chuồng là sân đá sẫm nhuộm màu nhà.
      const H = ['#e5383b', '#2fbf71', '#f6b81a', '#3a86ff'];
      const D = ['#5d2427', '#1f4a33', '#5c4714', '#22396b'];
      const START = { '1,6': 0, '8,1': 1, '13,8': 2, '6,13': 3 };
      const board = document.getElementById('board');
      for (let r = 0; r < 15; r++)
        for (let c = 0; c < 15; c++) {
          const i = document.createElement('i');
          const inArm = (c >= 6 && c <= 8) || (r >= 6 && r <= 8);
          let color;
          if (r === 7 && c === 7) color = '#ece8e1';
          else if (r === 7 && c >= 1 && c <= 6) color = H[0];
          else if (c === 7 && r >= 1 && r <= 6) color = H[1];
          else if (r === 7 && c >= 8 && c <= 13) color = H[2];
          else if (c === 7 && r >= 8 && r <= 13) color = H[3];
          else if (inArm) color = START[`${c},${r}`] !== undefined ? H[START[`${c},${r}`]] : '#6e737a';
          else color = D[r < 6 ? (c < 6 ? 0 : 1) : c < 6 ? 3 : 2];
          i.style.background = color;
          board.appendChild(i);
        }
    </script>
  </body>
</html>
